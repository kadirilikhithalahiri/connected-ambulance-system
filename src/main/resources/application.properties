# Connected Ambulance System - Spring Boot Configuration
spring.application.name=connected-ambulance-system
server.port=${PORT:8080}

# Reverse proxy / cloud load balancer SSL header detection
server.forward-headers-strategy=framework

# Database Connection Settings (Fail-Closed: Explicit Environment Variables Required, No Silent Fallbacks)
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=EmergencyHikariPool

# Server-Side Session & Cookie Security
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Error Response Sanitization (Never leak stack traces or internal details)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
